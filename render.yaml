services:
  - type: web
    name: algotrader-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: REPLACE_WITH_POSTGRES_INTERNAL_URL
      - key: PYTHON_VERSION
        value: "3.11.4"

  - type: web
    name: algotrader-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: bash build.sh
    staticPublishPath: .
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: REPLACE_WITH_BACKEND_URL

  - type: pserv
    name: algotrader-db
    runtime: postgres
    plan: free
    region: oregon