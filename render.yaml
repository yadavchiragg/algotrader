services:
  # ── Backend: FastAPI + WebSocket ──────────────────────────────────────────
  - type: web
    name: algotrader-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: REPLACE_WITH_POSTGRES_INTERNAL_URL
      - key: PYTHON_VERSION
        value: "3.11.4"

  # ── Frontend: Next.js Static Site ────────────────────────────────────────
  - type: web
    name: algotrader-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: REPLACE_WITH_BACKEND_URL  # e.g. https://algotrader-api.onrender.com

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  - type: pserv
    name: algotrader-db
    runtime: postgres
    plan: free
    region: oregon